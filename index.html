    // Safe numerical formatting helper preventing TypeError: Cannot read properties of null (reading 'toFixed')
    const formatPrice = (val, decimals = 0) => {
      const num = Number(val);
      return (isNaN(num) ? 0 : num).toFixed(decimals);
    };

    // --- ERROR BOUNDARY ---
    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, info) {
        console.error("App Error caught by boundary:", error, info);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen flex items-center justify-center bg-obsidian-950 text-white p-6">
              <div className="max-w-md w-full bg-obsidian-900 border border-red-500/40 p-6 rounded-2xl text-center">
                <h2 className="text-lg font-bold text-red-400 mb-2">Something went wrong</h2>
                <p className="text-xs text-gray-400 mb-4">{this.state.error?.message || "An unexpected error occurred."}</p>
                <button
                  onClick={() => { localStorage.clear(); window.location.reload(); }}
                  className="px-4 py-2 bg-gold-500 text-black text-xs font-bold rounded-xl"
                >
                  Reset Workspace & Reload
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // --- HTML5 WEB AUDIO API KITCHEN SOUND CHIME ---
    function playKdsChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const t = ctx.currentTime;
        
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = "sine";
        osc1.frequency.setValueAtTime(587.33, t); // D5
        gain1.gain.setValueAtTime(0.3, t);
        gain1.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start(t);
        osc1.stop(t + 0.45);

        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = "sine";
        osc2.frequency.setValueAtTime(880, t + 0.15); // A5
        gain2.gain.setValueAtTime(0.35, t + 0.15);
        gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.9);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(t + 0.15);
        osc2.stop(t + 0.9);
      } catch (e) {
        console.warn("KDS Chime sound blocked or unsupported:", e);
      }
    }

        [...orders, ...sessionOrders].forEach(o => {
          if (o && o.id && !allOrdersMap.has(o.id)) {
            allOrdersMap.set(o.id, o);
          }
        });
        const allOrdersList = Array.from(allOrdersMap.values());

        const servedOrders = allOrdersList.filter(o => o.status === "served");
        const cancelledOrders = allOrdersList.filter(o => o.status === "cancelled");
        const activeOrders = allOrdersList.filter(o => o.status === "cooking" || o.status === "pending");

        const grossSales = servedOrders.reduce((sum, o) => sum + (Number(o.total) || 0), 0);
        const subtotalSum = servedOrders.reduce((sum, o) => sum + (Number(o.subtotal) || 0), 0);
        const discountSum = servedOrders.reduce((sum, o) => sum + (Number(o.discount) || 0), 0);
        const gstSum = servedOrders.reduce((sum, o) => sum + (Number(o.gst) || 0), 0);
        const serviceChargeSum = servedOrders.reduce((sum, o) => sum + (Number(o.serviceCharge) || 0), 0);
        const tipSum = servedOrders.reduce((sum, o) => sum + (Number(o.tip) || 0), 0);

        let upiTotal = 0, upiCount = 0;
        let cashTotal = 0, cashCount = 0;
        let cardTotal = 0, cardCount = 0;

        servedOrders.forEach(o => {
          const m = String(o.paymentMethod || "UPI").toUpperCase();
          const tot = Number(o.total) || 0;
          if (m.includes("CASH")) {
            cashTotal += tot;
            cashCount += 1;
          } else if (m.includes("CARD")) {
            cardTotal += tot;
            cardCount += 1;
          } else {
            upiTotal += tot;
            upiCount += 1;
          }
        });

        // Best-selling dishes tally across served orders
        const dishTally = {};
        servedOrders.forEach(o => {
          (o.items || []).forEach(item => {
            if (!item || !item.name) return;
            const key = item.name;
            if (!dishTally[key]) {
              dishTally[key] = {
                name: item.name,
                qty: 0,
                price: Number(item.price) || 0,
                revenue: 0,
                isVeg: !!item.isVeg
              };
            }
            const q = Number(item.qty) || 1;
            dishTally[key].qty += q;
            dishTally[key].revenue += q * (Number(item.price) || 0);
          });
        });

        const topDishes = Object.values(dishTally)
          .sort((a, b) => b.qty - a.qty || b.revenue - a.revenue)
          .slice(0, 3);

        const avgOrderValue = servedOrders.length > 0 ? (grossSales / servedOrders.length) : 0;

        return {
          totalOrdersCount: allOrdersList.length,
          servedOrders,
          cancelledOrders,
          activeOrders,
          grossSales,
          subtotalSum,
          discountSum,
          gstSum,
          serviceChargeSum,
          tipSum,
          upiTotal,
          upiCount,
          cashTotal,
          cashCount,
          cardTotal,
          cardCount,
          topDishes,
          avgOrderValue

                        </div>
                        <div className="flex justify-between py-1 border-b border-gray-800/60 text-gray-300">
                          <span>Service Charge ({outletInfo.serviceChargeRate || 5}%)</span>
                          <span className="font-mono font-bold text-white">₹{formatPrice(dailyAuditData.serviceChargeSum, 2)}</span>
                        </div>
                        <div className="flex justify-between py-1 text-gray-300">
                          <span>Staff Gratuity / Tips</span>
                          <span className="font-mono font-bold text-gold-400">₹{formatPrice(dailyAuditData.tipSum, 0)}</span>
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Top 3 Best-Selling Dishes of the Day */}
                  <div className="p-4 rounded-xl bg-obsidian-900 border border-gold-500/30">
                    <div className="flex items-center justify-between border-b border-gray-800 pb-2 mb-3">
                      <h4 className="font-serif font-bold text-xs text-gold-300 uppercase tracking-wider flex items-center gap-1.5">
                        <span>🏆</span>
                        <span>Top 3 Best-Selling Dishes Today</span>
                      </h4>
                      <span className="text-[10px] text-gray-400">Culinary Performance Leaderboard</span>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                      {dailyAuditData.topDishes.length > 0 ? (
                        dailyAuditData.topDishes.map((dish, dIdx) => (
                          <div key={dIdx} className="p-3 rounded-xl bg-obsidian-850 border border-gray-800 flex flex-col justify-between">
                            <div className="flex items-center gap-2 mb-1">
                              <span className={`w-5 h-5 rounded-full flex items-center justify-center text-xs font-extrabold ${
                                dIdx === 0 ? "bg-amber-500 text-black" : dIdx === 1 ? "bg-gray-300 text-black" : "bg-amber-700 text-white"
                              }`}>
                                {dIdx + 1}
                              </span>
                              <span className="font-bold text-white text-xs truncate">{dish.name}</span>
                            </div>
                            <div className="flex justify-between items-baseline text-xs text-gray-400 mt-2">
                              <span>{dish.qty} orders sold</span>
                              <span className="font-mono font-bold text-gold-400">₹{formatPrice(dish.revenue, 0)}</span>
                            </div>
                          </div>
                        ))
                      ) : (
                        <div className="col-span-3 text-center py-4 text-xs text-gray-500">
                          No served dishes recorded for today yet.
                        </div>
                      )}
                    </div>
                  </div>

                  {/* Sign-off Memo Footer */}
                  <div className="pt-2 border-t border-gray-800 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-[10px] text-gray-500">
                    <span>Generated automatically by Golden Hotel & Banquet Property ERP Engine.</span>
                    <span>Verified by: ______________________ (Shift General Manager)</span>
                  </div>

                </div>

                {/* Action Toolbar */}
                <div className="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 pt-2">
                  <div className="flex flex-wrap items-center gap-2">
                    <button
                      onClick={() => window.print()}
                      className="px-4 py-2.5 rounded-xl bg-gold-500 hover:bg-gold-400 text-black font-bold text-xs flex items-center gap-2 shadow-lg transition-all"
                    >
                      <i data-lucide="printer" className="w-4 h-4"></i>
                      <span>Print Shift Audit Report</span>
                    </button>

                    <button
                      onClick={handleShareAuditWhatsApp}
                      className="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs flex items-center gap-2 shadow-md shadow-emerald-600/20 transition-all"
                    >
                      <i data-lucide="message-circle" className="w-4 h-4"></i>
                      <span>Share Summary via WhatsApp</span>
                    </button>
                  </div>

                  <button
                    onClick={() => setIsDailyAuditModalOpen(false)}
                    className="px-5 py-2.5 rounded-xl bg-obsidian-800 hover:bg-obsidian-750 text-gray-300 hover:text-white font-bold text-xs border border-gray-700 transition-all"
                  >
                    Close Audit
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* ================= GLOBAL TOAST NOTIFICATION ================= */}
          {toast && (
            <div className="fixed top-16 right-4 z-50 max-w-sm bg-obsidian-900 border border-gold-500/50 text-white p-3 rounded-2xl shadow-2xl flex items-center gap-3">
              <div className="w-2 h-2 rounded-full bg-gold-400 shrink-0"></div>
              <div>
                <div className="text-xs font-bold text-gold-300">{toast.title}</div>
                <div className="text-[11px] text-gray-400">{toast.message}</div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render Root wrapped in Error Boundary
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
